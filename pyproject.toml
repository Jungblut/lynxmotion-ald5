[project]
name = "lynxmotion-AL5D"
version = "0.1.0"
description = "Python interface for Lynxmotion AL5D"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "assertpy>=1.1",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["al5d"]
testpaths = ["tests"]
