[project]
# lerobot discovers plugins by *distribution* name (must start with "lerobot_robot_"),
# so this one distribution ships both importable packages:
#   import al5d                # serial driver only, no lerobot needed
#   import lerobot_robot_al5d  # lerobot bindings (needs the "lerobot" extra)
name = "lerobot_robot_al5d"
version = "0.1.0"
description = "Python interface for Lynxmotion AL5D, with LeRobot bindings"
readme = "README.md"
# lerobot pins numpy<2.3, which has no wheels for Python 3.14 yet (see .python-version)
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
lerobot = [
    "lerobot>=0.6.1",
]

[dependency-groups]
dev = [
    "assertpy>=1.1",
    "lerobot>=0.6.1",
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["al5d", "lerobot_robot_al5d"]
exclude = ["al5d/test.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires SSC-32 / AL5D hardware and serial device",
    "motion: integration test that moves servos (clear workspace first)",
]
